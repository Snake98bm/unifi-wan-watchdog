{% extends "base.html" %}
{% block login %}
<div class="card" style="max-width: 360px; margin: 14vh auto 0;">
  <h2>WAN Watchdog <span class="sub">v{{ version }}</span></h2>
  <p class="muted" style="margin: 0 0 14px;">Sign in to continue.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><input type="password" name="password" placeholder="Password" autofocus required style="width: 100%;"></p>
    <button class="primary" type="submit" style="width: 100%; justify-content: center;">Sign in</button>
  </form>
</div>
{% endblock %}
