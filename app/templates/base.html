<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block head %}{% endblock %}
<title>WAN Watchdog</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d232b; --muted: #5d6875; --border: #dde1e6;
  --up: #1f8a4c; --down: #c62f2f; --warn: #b26a00; --accent: #2f6fd6; --code: #eef1f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --card: #1d232b; --text: #e4e8ec; --muted: #9aa5b1; --border: #2f3842;
    --up: #46c07a; --down: #ef6b6b; --warn: #e2a54a; --accent: #6f9ff0; --code: #262e37;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
header h1 { font-size: 18px; margin: 0; }
nav { display: flex; gap: 14px; align-items: center; }
nav a { color: var(--accent); text-decoration: none; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.card h2 { margin: 0 0 8px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: #fff; text-transform: uppercase; }
.pill.up { background: var(--up); } .pill.down { background: var(--down); }
.pill.private { background: var(--warn); } .pill.unknown { background: var(--muted); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
.note { color: var(--warn); margin: 6px 0; }
button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
button.danger { border-color: var(--down); color: var(--down); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--border); background: var(--card); }
.flash.error { border-color: var(--down); color: var(--down); } .flash.ok { border-color: var(--up); color: var(--up); }
.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--warn); color: var(--warn); }
.banner.err { border-color: var(--down); color: var(--down); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.lvl-error, td.lvl-warn { color: var(--down); } td.lvl-action { color: var(--accent); font-weight: 600; }
td.ts { white-space: nowrap; color: var(--muted); }
.pill + .pill { margin-left: 4px; }
.table-wrap { overflow-x: auto; }
pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
.muted { color: var(--muted); }
form.inline { display: inline; }
label { margin-right: 14px; }
</style>
</head>
<body>
{% if session.auth %}
<header>
  <h1>WAN Watchdog <span class="muted" style="font-size: 13px; font-weight: normal;">v{{ version }}</span></h1>
  <nav>
    <a href="{{ url_for('dashboard') }}">Status</a>
    <a href="{{ url_for('log') }}">Log</a>
    <a href="{{ url_for('captures') }}">Modem logs</a>
    <a href="{{ url_for('all_settings') }}">Settings</a>
    <a href="{{ url_for('diag') }}">Diagnostics</a>
    <form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button>Log out</button></form>
  </nav>
</header>
{% endif %}
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
