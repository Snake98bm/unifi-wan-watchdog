services:
  wan-watchdog:
    image: local/wan-watchdog:1
    container_name: wan-watchdog
    hostname: wan-watchdog
    restart: unless-stopped
    mac_address: "02:42:c0:a8:01:32"   # any fixed locally administered MAC, so the gateway sees one stable client
    networks:
      lan:
        ipv4_address: ${WATCHDOG_IP:?set WATCHDOG_IP in .env}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    volumes:
      - /docker/wan-watchdog:/data
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      # Addresses and secrets all come from .env. Everything else is on the web page's Settings tab
      # (saved in /data/settings.json).
      UNIFI_URL: ${UNIFI_URL:?set UNIFI_URL in .env}
      ATT_GATEWAY: ${ATT_GATEWAY:-192.168.1.254}
      UNIFI_API_KEY: ${UNIFI_API_KEY:?set UNIFI_API_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ATT_ACCESS_CODE: ${ATT_ACCESS_CODE:-}
      QUECTEL_GATEWAY: ${QUECTEL_GATEWAY:-192.168.225.1}
      QUECTEL_USER: ${QUECTEL_USER:-}
      QUECTEL_PASSWORD: ${QUECTEL_PASSWORD:-}
      # only seed the VPN settings the first time; then they're on the Settings page
      VPN_LABEL: ${VPN_LABEL:-VPN}
      VPN_IFACE: ${VPN_IFACE:-}
      VPN_BAN_URLS: ${VPN_BAN_URLS:-}

  # Internet probes: one per WAN, each on a VLAN the gateway routes out of that WAN only (policy-based route with
  # the kill switch on). They get a DHCP address, listen on nothing, and only write probes/<wan>.json.
  wan1-probe: &probe
    image: local/wan-watchdog:1
    container_name: wan1-probe
    hostname: wan1-probe
    restart: unless-stopped
    entrypoint: ["/app/probe-entry.sh"]
    user: "0:0"                          # root only for the DHCP client; the probe itself runs as uid 1000
    networks:
      wan1_probe:
        mac_address: "02:00:00:00:01:01"   # fixed, so the DHCP lease and the UniFi client stay the same
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    tmpfs:
      - /tmp
    volumes:
      - /docker/wan-watchdog/probes:/probes
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PROBE_WAN: wan1
      PROBE_HOSTNAME: wan1-probe
    healthcheck:
      test: ["CMD", "python", "/app/probe.py", "--health"]
      interval: 60s
      timeout: 5s
      start_period: 60s

  wan2-probe:
    <<: *probe
    container_name: wan2-probe
    hostname: wan2-probe
    networks:
      wan2_probe:
        mac_address: "02:00:00:00:01:02"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PROBE_WAN: wan2
      PROBE_HOSTNAME: wan2-probe

  # VPN probe: on a VLAN the gateway routes through a UniFi VPN client only (kill switch on). Same checks, plus the
  # ban-check sites from the Settings page. Leave this service out if you have no such VLAN.
  vpn-probe:
    <<: *probe
    container_name: vpn-probe
    hostname: vpn-probe
    networks:
      vpn_probe:
        mac_address: "02:00:00:00:01:03"
    dns: ${VPN_PROBE_DNS:-1.1.1.1}    # ban-check sites are looked up through the VPN, like any client on that VLAN
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PROBE_WAN: vpn
      PROBE_HOSTNAME: vpn-probe

networks:
  lan:
    external: true
    name: ${WATCHDOG_NETWORK:?set WATCHDOG_NETWORK in .env}
  # The real address comes from DHCP; Docker only needs a placeholder subnet, which the probe drops at start.
  wan1_probe:
    driver: macvlan
    driver_opts:
      parent: ${WAN1_PROBE_PARENT:?set WAN1_PROBE_PARENT in .env}
    ipam:
      config:
        - subnet: 169.254.201.0/30
  wan2_probe:
    driver: macvlan
    driver_opts:
      parent: ${WAN2_PROBE_PARENT:?set WAN2_PROBE_PARENT in .env}
    ipam:
      config:
        - subnet: 169.254.202.0/30
  vpn_probe:
    driver: macvlan
    driver_opts:
      parent: ${VPN_PROBE_PARENT:?set VPN_PROBE_PARENT in .env}
    ipam:
      config:
        - subnet: 169.254.203.0/30
